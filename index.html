<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="body">
    <main>
        <h1>Gerenciador de Tarefas</h1> <!-- espaço pro nome da aplicação -->
        <p>Organize a sua semana!</p> <!-- colocar alguma frase relacionada a organização para a estética -->
    
        <section class="addTarefas">
            <form id="formTarefa">
                <h2>Nova Tarefa</h2>

                <label>Descrição:</label>
                <textarea name="descricao" id="descricao" rows="2" placeholder="Descreva a tarefa..."></textarea>
                
                <label>Categoria:</label>
                <select name="categoria" id="categoria">
                    <option value="trabalho">Trabalho</option>
                    <option value="estudos">Estudos</option>
                    <option value="compras">Compras</option>
                    <option value="casa">Casa</option>
                    <option value="pessoal">Pessoal</option>
                </select>

                <label>Prioridade:</label>
                <select name="prioridade" id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

                <label>Prazo:</label>
                <input type="date" name="prazo" id="prazo">

                <button type="submit" id="adicionar">+ A
                    dicionar tarefa</button>
            </form>
        </section>
        
        <section class="tarefasExistentes">
            <h2>Minhas Tarefas</h2>

            <label>Situação:</label>
            <select name="filtroSituacao" id="filtroSituacao">
                <option>Todas</option>
                <option>Pendentes</option>
                <option>Concluídas</option>
            </select>

            <label>Categoria:</label>
            <select name="filtroCategoria" id="filtroCategoria">
                <option value="trabalho">Trabalho</option>
                <option value="estudos">Estudos</option>
                <option value="compras">Compras</option>
                <option value="casa">Casa</option>
                <option value="pessoal">Pessoal</option>
            </select>

            <ul id="listaTarefas">

            </ul>
        </section>
    </main>
</body>
</html>
